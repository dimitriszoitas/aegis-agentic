name: Agentic experiment checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: npm run mcp:setup
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: npm run agentic:browser
      - run: npm run product:browser
      - run: npm run page-layout:browser
      - run: npm run build-storybook
      - run: node scripts/verify-agentic-storybook.mjs
      - run: node scripts/verify-contract-storybook.mjs
      - run: npm run token-input:adoption
      - run: npm run relay:check -- --local-dependencies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-evidence
          path: artifacts/
